name: Detector de actividad

on:
  schedule:
    - cron: "17 5 * * *" # todos los días, 00:17 en Colombia (UTC-5)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/detector.yml"

permissions:
  contents: write

concurrency:
  group: detector
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar tipografía
        run: pip install fonttools==4.66.1 uharfbuzz==0.56.3

      - name: Medir el último año
        run: python scripts/build.py live
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar la medición
        run: |
          if git diff --quiet -- assets/detector.svg; then
            echo "Sin cambios en el detector."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/detector.svg
          git commit -m "chore(detector): medición del $(date -u +%F)"
          git push
