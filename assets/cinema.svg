<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Fuera del editor — Arrival, Creed, Avatar</title>
  <desc id="desc">Un círculo de tinta suspendido, una escalera iluminada y plantas bioluminiscentes. Ilustraciones originales sobre perspectiva, perseverancia e imaginación.</desc>
  <defs>
    <radialGradient id="mist"><stop stop-color="#a5b1cd" stop-opacity=".17"/><stop offset="1" stop-color="#a5b1cd" stop-opacity="0"/></radialGradient>
    <radialGradient id="forest"><stop stop-color="#65f4dc" stop-opacity=".15"/><stop offset="1" stop-color="#65f4dc" stop-opacity="0"/></radialGradient>
    <linearGradient id="rise" x2="0" y2="1"><stop stop-color="#f1bd75"/><stop offset="1" stop-color="#554434"/></linearGradient>
  </defs>
  <style>
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
    .sans{font-family:Arial,Helvetica,sans-serif}
    .spore{animation:breath 5s ease-in-out infinite}.late{animation-delay:-2.5s}
    @keyframes breath{50%{opacity:.25}}
    @media(prefers-reduced-motion:reduce){.spore{animation:none!important}}
  </style>
