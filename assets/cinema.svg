  <path d="M703 84v20m0-14l-10 9m10-9l11-6m-11 20l-8 9m8-9l8 9" stroke="#f1bd75" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="1000" cy="153" r="126" fill="url(#forest)"/>
