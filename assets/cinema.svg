    <path d="M1000 237Q990 150 949 107M1001 220Q1024 147 1068 118M976 238Q941 194 910 182M1025 237Q1060 204 1100 194" stroke="#38796f" stroke-width="2"/>
    <path d="M949 107Q929 135 970 162Q977 130 949 107ZM1068 118Q1032 128 1020 170Q1067 169 1068 118ZM910 182Q916 212 961 220Q951 187 910 182ZM1100 194Q1060 182 1047 224Q1080 225 1100 194Z" stroke="#65f4dc" fill="#65f4dc" fill-opacity=".06"/>
